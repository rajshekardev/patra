name: Distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-11a

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            toolchain: linux-amd64
            extension: tar.gz
            asset: patra-linux-amd64
            sha256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618
          - runner: ubuntu-24.04-arm
            toolchain: linux-arm64
            extension: tar.gz
            asset: patra-linux-arm64
            sha256: 5bdba22447ea46a99765235e401c2ad83930f967f987aab1531ed76c3aa7ea3b
          - runner: macos-15
            toolchain: macos-arm64
            extension: tar.gz
            asset: patra-macos-universal
            sha256: fa10eee280c8786758e3ff0b8fdd9355e1c9447b1f0b8c72764e25ee4ebc3e22
          - runner: windows-2022
            toolchain: windows-amd64
            extension: zip
            asset: patra-windows-amd64.exe
            sha256: 259effedf2997293c8fa4a5e497496f8ebce9f826652d9dd353a9dd2113c31fd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        run: |
          version=$(cat VERSION)
          if [[ ! $version =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be a stable tag such as v0.1.2" >&2
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install Odin
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          EXTENSION: ${{ matrix.extension }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          archive="odin-$TOOLCHAIN-$ODIN_VERSION.$EXTENSION"
          toolchain_dir="$RUNNER_TEMP/odin"
          mkdir -p "$toolchain_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/$archive" \
            --output "$toolchain_dir/$archive"
          digest=$(openssl dgst -sha256 "$toolchain_dir/$archive")
          test "${digest##* }" = "$SHA256"
          if [[ $EXTENSION == zip ]]; then
            python -m zipfile -e "$toolchain_dir/$archive" "$toolchain_dir"
          else
            tar -xzf "$toolchain_dir/$archive" -C "$toolchain_dir"
          fi
          compiler=$(find "$toolchain_dir" -type f \( -name odin -o -name odin.exe \) -print -quit)
          test -n "$compiler"
          compiler_dir=$(dirname "$compiler")
          if [[ $RUNNER_OS == Windows ]]; then
            compiler_dir=$(cygpath -w "$compiler_dir")
          fi
          printf '%s\n' "$compiler_dir" >> "$GITHUB_PATH"

      - name: Build executable
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          odin version
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              odin build . -o:speed -extra-linker-flags:-static -out:"dist/$ASSET"
              ;;
            macOS)
              odin build . -o:speed -minimum-os-version:13.0 -out:"$RUNNER_TEMP/patra-arm64"
              odin build . -o:speed -target:darwin_amd64 -minimum-os-version:13.0 \
                -extra-linker-flags:'-arch x86_64' -out:"$RUNNER_TEMP/patra-amd64"
              lipo -create "$RUNNER_TEMP/patra-arm64" "$RUNNER_TEMP/patra-amd64" -output "dist/$ASSET"
              lipo "dist/$ASSET" -verify_arch arm64 x86_64
              ;;
            Windows)
              odin build . -o:speed -out:"dist/$ASSET"
              ;;
          esac

      - name: Smoke-test the executable
        env:
          ASSET: ${{ matrix.asset }}
          PATRA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="$PWD/dist/$ASSET"
          cd "$(mktemp -d)"
          banner=$("$binary")
          [[ $banner == *'Odin-based task runner'* ]]
          [[ $banner == "$("$binary" --help)" ]]
          for builtin in --help --init --version --new --update; do
            [[ $banner == *"$builtin"* ]]
          done
          test "$("$binary" --version | tr -d '\r')" = "patra $PATRA_VERSION"
          expect_usage_error() {
            local status=0
            "$binary" "$@" || status=$?
            test "$status" -eq 2
          }
          expect_usage_error --unknown
          expect_usage_error --init extra
          expect_usage_error --update extra
          test ! -e run.patra
          "$binary" --init
          help=$("$binary" help | tr -d '\r')
          test "$help" = 'patra help'
          for task in setup init version new update; do
            printf '\n%s:\n    echo "%s task"\n' "$task" "$task" >> run.patra
            test "$("$binary" "$task" | tr -d '\r')" = "$task task"
          done
          printf '\ngroup:\n    --help:\n        echo "nested task"\n' >> run.patra
          test "$("$binary" group --help | tr -d '\r')" = 'nested task'
          cp run.patra original.patra
          status=0
          "$binary" --init || status=$?
          test "$status" -eq 1
          cmp run.patra original.patra
          printf '\nfail:\n    exit 7\n' >> run.patra
          status=0
          "$binary" fail || status=$?
          test "$status" -eq 7

      - name: Test the project wizard in a terminal
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: python3 scripts/test_wizard.py "dist/$ASSET"

      - name: Test the updater
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: python3 scripts/test_update.py "dist/$ASSET"

      - name: Package and test the Linux installer
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          staging=$(mktemp -d)
          install -m 0755 "dist/$ASSET" "$staging/patra"
          install -m 0755 scripts/install.sh "$staging/install.sh"
          tar -czf "dist/$ASSET.tar.gz" -C "$staging" patra install.sh

          extracted=$(mktemp -d)
          tar -xzf "dist/$ASSET.tar.gz" -C "$extracted"
          install_home=$(mktemp -d)
          output=$(HOME="$install_home" SHELL=/bin/sh "$extracted/install.sh")
          [[ $output == *'Add ~/.local/bin to PATH'* ]]
          export PATH="$install_home/.local/bin:$PATH"
          HOME="$install_home" "$extracted/install.sh"
          test "$(command -v patra)" = "$install_home/.local/bin/patra"
          patra

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: patra-*
          path: dist
          merge-multiple: true
      - name: Publish executables and source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=patra/ --output=dist/patra-source.zip HEAD
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Patra $GITHUB_REF_NAME" --generate-notes
